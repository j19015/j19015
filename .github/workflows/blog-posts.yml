name: Update Blog Posts

on:
  schedule:
    # 毎日 07:00 JST (22:00 UTC)
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts from kt-tech.blog
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://kt-tech.blog/feed.xml"
          max_post_count: 6
          commit_message: "chore: update recent blog posts"
